<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Latihan Membaca Jepang</title>
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2300ff00'/%3E%3Ctext x='32' y='47' font-size='40' text-anchor='middle' fill='%23111' font-family='sans-serif'%3E読%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff;--surface:#fbfcfb;--ink:#222222;--muted:#888888;--line:#e8ece8;
  --accent:#00ff00;--accent-ink:#111111;--accent-text:#00ff00;
  --seal:#f6d3cb;--seal-ink:#7d4238;
  --ok:#3f8f62;--okbg:#eef8f1;--ok-line:#b3dfc2;
  --bad:#b5564c;--badbg:#fdf0ee;--bad-line:#f0c4be;
  --neutral-bg:#f5f6f4;
  --shadow:0 1px 2px rgba(0,0,0,.04);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);min-height:100dvh;line-height:1.5;
  font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif}
[hidden]{display:none!important}
#app{max-width:640px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 18px 48px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px}

.brand{display:flex;align-items:center;gap:14px;margin:6px 0 8px}
.seal{width:54px;height:54px;border-radius:12px;background:var(--seal);color:var(--seal-ink);display:grid;place-items:center;
  font-size:30px;font-weight:900;box-shadow:var(--shadow);flex:none}
h1{font-size:24px;font-weight:700;margin:0;line-height:1.2}
.brand p{margin:2px 0 0;color:var(--muted);font-size:14px}
.lbl{font-size:13px;letter-spacing:.02em;color:var(--muted);margin:26px 0 10px;font-weight:500;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

.seg{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{flex:1;border:0;background:transparent;padding:10px 4px;border-radius:10px;font-size:14px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.seg.small button{padding:7px 4px;font-size:13px}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mcard{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;
  box-shadow:var(--shadow);transition:transform .12s,border-color .12s}
.mcard:hover{border-color:var(--accent-text)}
.mcard:active{transform:scale(.98)}
.mcard .big{font-size:44px;line-height:1;font-weight:700;color:var(--accent-text);display:block;margin-bottom:12px}
.mcard b{display:block;font-size:16px}
.mcard small{color:var(--muted);font-size:12.5px;display:block;margin-top:2px}

.foot{margin-top:30px;color:var(--muted);font-size:13px;text-align:center}
.foot button{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:13px;padding:4px}

.topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ghost{background:transparent;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:700;font-size:14px}
.pill{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700}
.score{margin-left:auto;font-size:14px;font-weight:700;color:var(--muted);white-space:nowrap}

.qcard{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:36px 16px;
  text-align:center;box-shadow:var(--shadow);min-height:190px;display:flex;align-items:center;justify-content:center}
.qtext{font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
  font-size:clamp(38px,11vw,64px);font-weight:500;line-height:1.5;line-break:strict;overflow-wrap:anywhere}
.qtext.long{font-size:clamp(26px,7vw,42px);line-height:1.6}
.qtext.hint{line-height:1.4}
.qtext .w{display:inline-flex;flex-direction:column;align-items:center;vertical-align:top}
.qtext .rd{font-size:.3em;line-height:1.3;color:var(--muted);font-weight:500;font-family:system-ui,sans-serif;letter-spacing:0;white-space:nowrap;min-height:1.3em}
.qtext .cs{display:flex;align-items:flex-start;line-height:1.25}
.qtext .c{display:flex;flex-direction:column;align-items:center}
.qtext .km{font-size:max(10px,.24em);line-height:1.2;color:#e8730c;font-weight:600;font-family:system-ui,sans-serif;letter-spacing:0;white-space:nowrap;margin-top:2px}
.sp{display:inline-block;width:.55em}

.tools{display:flex;gap:8px;margin:12px 0}
.tools button{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:14px;font-weight:700}
.tools button[aria-pressed=true]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.meaning{background:var(--neutral-bg);border-radius:12px;padding:10px 14px;font-size:15px;margin-bottom:12px}

.answer{display:flex;gap:8px}
.answer input{flex:1;min-width:0;font:inherit;font-size:18px;padding:14px;border-radius:14px;border:2px solid var(--line);
  background:var(--surface);color:var(--ink)}
.answer input:focus{border-color:var(--accent-text);outline:none}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px;padding:14px 18px;font-weight:700;font-size:16px}
.mic{width:54px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-size:22px;flex:none}
.mic.on{border-color:var(--seal-ink);background:var(--seal);animation:pulse 1.1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(125,66,56,.15)}}
.status{min-height:22px;font-size:14px;color:var(--muted);margin:8px 2px}

.res{border-radius:18px;padding:16px;margin-top:6px}
.res.ok{background:var(--okbg);border:1px solid var(--ok-line)}
.res.bad{background:var(--badbg);border:1px solid var(--bad-line)}
.res.skip{background:var(--neutral-bg);border:1px solid var(--line)}
.res-h{font-size:19px;font-weight:700;margin-bottom:8px}
.res.ok .res-h{color:var(--ok)} .res.bad .res-h{color:var(--bad)}
.row{display:flex;gap:10px;padding:5px 0;border-top:1px dashed var(--line);font-size:15px}
.row:first-of-type{border-top:0}
.row span{color:var(--muted);width:82px;flex:none;font-size:13px;padding-top:2px}
.row b{font-weight:700;overflow-wrap:anywhere}
.row b.jp{font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;font-size:18px}
.rbtns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.rbtns button{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:700;font-size:14px}
.actions{display:flex;gap:8px;margin-top:12px}
.actions .primary{flex:1}
.actions .ghost{flex:none}
</style>
</head>
<body>
<div id="app">

  <!-- ================= HALAMAN AWAL ================= -->
  <section id="home">
    <header class="brand">
      <div class="seal" aria-hidden="true">読</div>
      <div>
        <h1>Latihan Membaca Jepang</h1>
        <p>日本語を読もう · soal acak, jawab dengan romaji atau suara</p>
      </div>
    </header>

    <h2 class="lbl">1 · Panjang soal</h2>
    <div class="seg" id="lenHome" role="group" aria-label="Panjang soal">
      <button data-len="word" aria-pressed="true">1 kata</button>
      <button data-len="phrase" aria-pressed="false">2–5 kata</button>
      <button data-len="sentence" aria-pressed="false">1 kalimat</button>
      <button data-len="mix" aria-pressed="false">Acak</button>
    </div>

    <h2 class="lbl">2 · Pilih huruf (langsung mulai)</h2>
    <div class="grid">
      <button class="mcard" data-mode="hira"><span class="big" lang="ja">あ</span><b>Hiragana</b><small>Huruf dasar · ひらがな</small></button>
      <button class="mcard" data-mode="kata"><span class="big" lang="ja">ア</span><b>Katakana</b><small>Kata serapan · カタカナ</small></button>
      <button class="mcard" data-mode="kanji"><span class="big" lang="ja">漢</span><b>Kanji umum</b><small>Kanji sehari-hari · 常用漢字</small></button>
      <button class="mcard" data-mode="mixed"><span class="big" lang="ja">混</span><b>Campuran</b><small>Seperti teks asli · 混合</small></button>
    </div>

    <p class="foot" id="stat"></p>
  </section>

  <!-- ================= HALAMAN SOAL ================= -->
  <section id="quiz" hidden>
    <div class="topbar">
      <button class="ghost" id="back">← Menu</button>
      <span class="pill" id="modePill"></span>
      <span class="score" id="score"></span>
    </div>
    <div class="seg small" id="lenQuiz" role="group" aria-label="Panjang soal">
      <button data-len="word" aria-pressed="true">1 kata</button>
      <button data-len="phrase" aria-pressed="false">2–5 kata</button>
      <button data-len="sentence" aria-pressed="false">1 kalimat</button>
      <button data-len="mix" aria-pressed="false">Acak</button>
    </div>

    <div class="qcard"><div class="qtext" id="qtext" lang="ja"></div></div>

    <div class="tools">
      <button id="hintBtn" aria-pressed="false">💡 Petunjuk bacaan</button>
      <button id="meanBtn" aria-pressed="false">📖 Arti</button>
    </div>
    <div class="meaning" id="meaning" hidden></div>

    <form class="answer" id="form" autocomplete="off">
      <input id="ans" type="text" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false"
             placeholder="Ketik bacaan (romaji)…" aria-label="Jawaban dalam romaji">
      <button class="primary" type="submit" id="checkBtn">Cek</button>
      <button class="mic" type="button" id="mic" aria-label="Jawab dengan suara" title="Jawab dengan suara">🎤</button>
    </form>
    <div class="status" id="micStatus" aria-live="polite"></div>

    <div id="result" aria-live="polite" hidden></div>

    <div class="actions">
      <button class="ghost" id="skip">Lewati</button>
      <button class="primary" id="next" hidden>Soal berikutnya →</button>
    </div>
  </section>
</div>

'use strict';

/* ======================================================================

   ====================================================================== */
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>[...el.querySelectorAll(s)];
const rand=a=>a[Math.floor(Math.random()*a.length)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;
const first=id=>id.split(';')[0].trim();
const kataToHira=s=>s.replace(/[\u30A1-\u30F6]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
const hasKanji=s=>/[\u3400-\u9fff]/.test(s);
const kanjiMode=m=>m==='kanji'||m==='mixed';
const spaced=m=>m==='hira'||m==='kata';

/* ======================================================================
   KANA -> ROMAJI  (dipakai untuk mencocokkan jawaban & petunjuk)
   ====================================================================== */
const KR={あ:'a',い:'i',う:'u',え:'e',お:'o',か:'ka',き:'ki',く:'ku',け:'ke',こ:'ko',さ:'sa',し:'shi',す:'su',せ:'se',そ:'so',
た:'ta',ち:'chi',つ:'tsu',て:'te',と:'to',な:'na',に:'ni',ぬ:'nu',ね:'ne',の:'no',は:'ha',ひ:'hi',ふ:'fu',へ:'he',ほ:'ho',
ま:'ma',み:'mi',む:'mu',め:'me',も:'mo',や:'ya',ゆ:'yu',よ:'yo',ら:'ra',り:'ri',る:'ru',れ:'re',ろ:'ro',わ:'wa',を:'wo',ん:'n',
が:'ga',ぎ:'gi',ぐ:'gu',げ:'ge',ご:'go',ざ:'za',じ:'ji',ず:'zu',ぜ:'ze',ぞ:'zo',だ:'da',ぢ:'ji',づ:'zu',で:'de',ど:'do',
ば:'ba',び:'bi',ぶ:'bu',べ:'be',ぼ:'bo',ぱ:'pa',ぴ:'pi',ぷ:'pu',ぺ:'pe',ぽ:'po',ゔ:'vu',ぁ:'a',ぃ:'i',ぅ:'u',ぇ:'e',ぉ:'o'};
const SM={ゃ:'ya',ゅ:'yu',ょ:'yo'};
function kanaToRomaji(src){
  const chars=[...kataToHira(src)];let out='',gem=false;
  for(let i=0;i<chars.length;i++){
    const c=chars[i];
    if(c==='っ'){gem=true;continue}
    if(c==='ー'){out+=out.replace(/[^aiueo]/g,'').slice(-1);continue}
    let base=KR[c];
    if(base===undefined){out+=c;gem=false;continue}
    const nx=chars[i+1];
    if(nx&&SM[nx]){
      base=['shi','chi','ji'].includes(base)?base.slice(0,-1)+SM[nx].slice(1):base.slice(0,-1)+SM[nx];i++;
    }else if(nx&&'ぁぃぅぇぉ'.includes(nx)){
      const v=KR[nx];base=c==='う'?'w'+v:base.replace(/[aiueo]$/,'')+v;i++;
    }
    if(gem){out+=base.startsWith('ch')?'t'+base:base[0]+base;gem=false}else out+=base;
  }
  return out;
}
/* bentuk kanonik romaji: toleran terhadap si/shi, ti/chi, tu/tsu, hu/fu, zi/ji, ou/oo, ō, wo/o, nn, dll. */
function canon(s){
  s=s.normalize('NFKC').toLowerCase()
    .replace(/([aiueo])-/g,'$1$1')
    .replace(/ā|â/g,'aa').replace(/ī|î/g,'ii').replace(/ū|û/g,'uu').replace(/ē|ê/g,'ee').replace(/ō|ô/g,'oo')
    .replace(/[^a-z]/g,'');
  return s
    .replace(/sy([aou])/g,'sh$1').replace(/(?:ty|cy)([aou])/g,'ch$1').replace(/(?:zy|jy|dy)([aou])/g,'j$1')
    .replace(/dzu|du/g,'zu').replace(/di/g,'ji').replace(/zi/g,'ji')
    .replace(/si/g,'shi').replace(/ti/g,'chi').replace(/tu/g,'tsu').replace(/(^|[^sc])hu/g,'$1fu')
    .replace(/wo/g,'o').replace(/ou/g,'oo').replace(/ei/g,'ee').replace(/cch/g,'tch')
    .replace(/nn(?![aiueoy])/g,'n');
}

const by=(arr,k)=>arr.find(x=>x.k===k);
const TOMO=by(N,'友達');

/* ======================================================================
   PEMBUAT TOKEN  (t = tampilan, r = bacaan kana, sf = bentuk tulisan kanji)
   ====================================================================== */
const nT=(e,m)=>({t:m==='hira'?e.h:m==='kata'?(e.c||e.h):(e.k||e.c||e.h),r:e.h,sf:e.k||e.c||e.h});
const aT=(a,m)=>({t:kanjiMode(m)?(a.k||a.h):a.h,r:a.h,sf:a.k||a.h});
const vT=(v,m,form)=>{
  const e=form==='dict'?v.d:v.m,s=form==='masu'?'ます':form==='mashita'?'ました':'';
  const base=kanjiMode(m)?v.k:v.h;
  return{t:base+e+s,r:v.h+e+s,sf:v.k+e+s};
};
const pc=(m,t,r,alt)=>({t,r:r||t,sf:t,alt:alt||null,sp:spaced(m)});   // partikel
const WA=m=>pc(m,'は','わ',['は']);
const GA=m=>pc(m,'が');
const DESU=()=>({t:'です',r:'です',sf:'です',att:true});
const PU=t=>({t,r:'',sf:t});
const fm=past=>past?'mashita':'masu';

function filt(pool,m){
  let f=pool;
  if(m==='hira')f=pool.filter(e=>!e.c);
  else if(m==='kata')f=pool.filter(e=>e.c);
  else if(m==='kanji')f=pool.filter(e=>e.k);
  return f.length?f:pool;
}
const pickN=(cats,m)=>rand(filt(N.filter(e=>cats.some(c=>e.cats.includes(c))),m));

/* ======================================================================
   GENERATOR: 1 KATA
   ====================================================================== */
const WC={};
function wordsFor(m){
  if(WC[m])return WC[m];
  const out=filt(N,m).map(e=>({tk:[nT(e,m)],id:e.id.replace(/;/g,' /')}));
  if(m!=='kata'){
    const inK=x=>m!=='kanji'||x.k;
    A.filter(inK).forEach(a=>out.push({tk:[aT(a,m)],id:a.id.replace(/;/g,' /')}));
    NA.filter(inK).forEach(a=>out.push({tk:[aT(a,m)],id:a.id.replace(/;/g,' /')}));
    V.forEach(v=>out.push({tk:[vT(v,m,'dict')],id:v.id.replace(/;/g,' /')}));
  }
  return WC[m]=out;
}
const genWord=m=>{const w=rand(wordsFor(m));return{tk:w.tk.map(o=>({...o})),id:cap(w.id)}};

/* ======================================================================
   GENERATOR: 2–5 KATA
   ====================================================================== */
function genPhrase(m){
  const n=2+Math.floor(Math.random()*4);
  const kind=rand(n===2?['list','chain','adj','na','no','no']:['list','chain','chain']);
  if(kind==='list'){
    const W=wordsFor(m),picks=[];let g=0;
    while(picks.length<n&&g++<200){const w=rand(W);if(!picks.includes(w))picks.push(w)}
    return{tk:picks.flatMap(w=>w.tk.map(o=>({...o,sp:true}))),id:cap(picks.map(w=>w.id).join(' · '))};
  }
  if(kind==='chain'){
    const ns=[];let g=0;
    while(ns.length<n&&g++<200){const e=pickN(rand([['f'],['d'],['a'],['b'],['t'],['x'],['p']]),m);if(!ns.includes(e))ns.push(e)}
    const tk=[];ns.forEach((e,i)=>{tk.push(nT(e,m));if(i<ns.length-1)tk.push(pc(m,'と'))});
    const ids=ns.map(e=>e.id.replace(/;/g,' /'));
    const id=ids.length===2?`${ids[0]} dan ${ids[1]}`:ids.slice(0,-1).join(', ')+`, dan ${ids[ids.length-1]}`;
    return{tk,id:cap(id)};
  }
  if(kind==='adj'){
    const a=rand(A.filter(x=>x.cats.includes('attr'))),t=pickN(['t'],m);
    return{tk:[{...aT(a,m),sp:spaced(m)},nT(t,m)],id:cap(`${t.id} ${first(a.id)}`)};
  }
  if(kind==='na'){
    const a=rand(NA.filter(x=>x.cats.includes('pl'))),p=pickN(['pt'],m);
    return{tk:[aT(a,m),pc(m,'な'),nT(p,m)],id:cap(`${p.id} ${first(a.id)}`)};
  }
  const mod=pickN(['pe','cn'],m),head=pickN(['h'],m);
  return{tk:[nT(mod,m),pc(m,'の'),nT(head,m)],id:cap(`${head.id} ${mod.id}`)};
}

/* ======================================================================
   GENERATOR: 1 KALIMAT
   ====================================================================== */
const ob=(cat,vk,p,f)=>({cl:(m,past)=>{
  const n=pickN([cat],m);
  return{tk:[nT(n,m),pc(m,p),vT(by(V,vk),m,fm(past))],id:f(n.id)};
}});
const TPL=[

  ob('f','食','を',x=>`makan ${x}`),

  {cl:(m,past)=>{const e=pickN(['e'],m),f=pickN(['f'],m);
    return{tk:[nT(e,m),pc(m,'で'),nT(f,m),pc(m,'を'),vT(by(V,'食'),m,fm(past))],id:`makan ${f.id} di ${e.id}`}}},
  {cl:(m,past)=>{const p=pickN(['p'],m);
    return{tk:[nT(TOMO,m),pc(m,'と'),nT(p,m),pc(m,'に'),vT(by(V,'行'),m,fm(past))],id:`pergi ke ${p.id} bersama teman`}}},
  {cl:(m,past)=>{const s=pickN(['s'],m);

  {cl:(m,past)=>{const p=pickN(['pt'],m);
    return{tk:[nT(p,m),pc(m,'で'),nT(TOMO,m),pc(m,'を'),vT(by(V,'待'),m,fm(past))],id:`menunggu teman di ${p.id}`}}},
  {cl:(m,past)=>{const p=pickN(['pt'],m);
    return{tk:[nT(p,m),pc(m,'で'),nT(TOMO,m),pc(m,'に'),vT(by(V,'会'),m,fm(past))],id:`bertemu teman di ${p.id}`}}},
  {nk:true,cl:(m,past)=>{const s=rand(SU);
    const suf=past?'しました':'します';
    return{tk:[nT({k:s.k,h:s.h,c:''},m),{t:suf,r:suf,sf:suf}],id:s.vid}}},
  {nk:true,cl:(m,past)=>{const v=rand(V.filter(x=>x.cats.includes('in')));
    return{tk:[vT(v,m,fm(past))],id:first(v.id)}}},

  {cp:m=>{const t=pickN(['t'],m),a=rand(A.filter(x=>x.cats.includes('z')||x.cats.includes('c')));
    return{tk:[nT(t,m),WA(m),aT(a,m),DESU(),PU('。')],id:`${cap(t.id)} itu ${first(a.id)}.`}}},
  {cp:m=>{const f=pickN(['f','d'],m),[k,idv]=rand([['美味しい','enak'],['高い','mahal'],['安い','murah']]);
    return{tk:[nT(f,m),WA(m),aT(by(A,k),m),DESU(),PU('。')],id:`${cap(f.id)} itu ${idv}.`}}},
  {nk:true,cp:m=>{const tm=by(N,rand(['今日','明日'])),a=by(A,rand(['暑い','寒い']));
    return{tk:[nT(tm,m),WA(m),aT(a,m),DESU(),PU('。')],id:`${cap(tm.id)} ${a.id}.`}}},
  {nk:true,cp:m=>{const tm=by(N,rand(['今日','明日'])),w=pickN(['wx'],m);
    return{tk:[nT(tm,m),WA(m),nT(w,m),DESU(),PU('。')],id:`${cap(tm.id)} ${w.id}.`}}},
  {cp:m=>{const n=pickN(['f','d','a','x'],m);
    return{tk:[nT(by(N,'私'),m),WA(m),nT(n,m),GA(m),aT(by(NA,'好き'),m),DESU(),PU('。')],id:`Saya suka ${n.id}.`}}},
  {cp:m=>{const p=pickN(['pt'],m),a=rand(NA.filter(x=>x.cats.includes('pl')));
    return{tk:[nT(p,m),WA(m),aT(a,m),DESU(),PU('。')],id:`${cap(p.id)} itu ${first(a.id)}.`}}},
  {nk:true,cp:m=>{const x=pickN(['i'],m);
    return{tk:[nT(by(N,'私'),m),WA(m),nT(x,m),DESU(),PU('。')],id:`Saya adalah ${x.id}.`}}},
  {cp:m=>{const p=pickN(['pt'],m),a=rand(A.filter(x=>x.cats.includes('di')));
    return{tk:[nT(p,m),WA(m),aT(a,m),DESU(),PU('。')],id:`${cap(p.id)} itu ${a.id}.`}}},
  {cp:m=>{const s=pickN(['fn'],m),a=rand(A.filter(x=>x.cats.includes('fu')));
    return{tk:[nT(s,m),WA(m),aT(a,m),DESU(),PU('。')],id:`${cap(s.id)} itu ${first(a.id)}.`}}},
];

function genSentence(m){
  const t=rand(TPL.filter(x=>!(m==='kata'&&x.nk)));
  if(t.cp)return t.cp(m);
  let tm=null,past=Math.random()<.25;
  if(Math.random()<.4){tm=pickN(['tm'],m);past=tm.h==='きのう'}
  const c=t.cl(m,past),tk=[];
  if(tm)tk.push(nT(tm,m),PU('、'));
  tk.push(...c.tk,PU('。'));
  const id=tm?`${cap(tm.id)}, (saya) ${c.id}.`:past?`(Saya) sudah ${c.id}.`:`(Saya) ${c.id}.`;
  return{tk,id};
}

const LEN_LABEL={word:'1 kata',phrase:'2–5 kata',sentence:'1 kalimat',mix:'Acak'};
const MODE_LABEL={hira:'ひらがな',kata:'カタカナ',kanji:'漢字',mixed:'混合'};

function readings(q){
  let acc=[''];
  q.tk.forEach(o=>{const opts=[o.r,...(o.alt||[])];acc=acc.flatMap(a=>opts.map(r=>a+r))});
  return[...new Set(acc)];
}
function makeQ(m,len,lastKey){
  let l=len==='mix'?rand(['word','phrase','sentence']):len,q,key;
  for(let i=0;i<8;i++){
    q=l==='word'?genWord(m):l==='phrase'?genPhrase(m):genSentence(m);
    key=q.tk.map(o=>o.t).join('');
    if(key!==lastKey)break;
  }
  q.len=l;q.key=key;q.mode=m;
  q.reads=readings(q);
  q.rom=new Set(q.reads.map(r=>canon(kanaToRomaji(r))));
  q.readText=q.tk.map(o=>o.r+(o.sp?' ':'')).join('').trim();
  q.romText=q.tk.filter(o=>o.r).map(o=>(o.att?'\u0008':' ')+kanaToRomaji(o.r)).join('').replace(/ ?\u0008/g,'').trim();
  q.surf=[q.tk.map(o=>o.sf).join(''),q.tk.map(o=>o.t).join('')];
  return q;
}
const normSp=s=>kataToHira(s.normalize('NFKC')).replace(/[\s。、，．,.!?！？「」『』…・~〜'"]/g,'');
function typedMatches(q,input){
  const v=input.trim();
  if(!v)return false;
  if(hasKanji(v)){const n=normSp(v);return q.surf.map(normSp).includes(n)}
  return q.rom.has(canon(v.replace(/[\u3040-\u30ff]+/g,x=>kanaToRomaji(x))));
}
function speechMatches(q,tr){
  const n=normSp(tr);
  if(!n)return false;
  if(/^[\u3040-\u309fー]+$/.test(n))return q.rom.has(canon(kanaToRomaji(n)));
  return q.surf.map(normSp).includes(n);
}

function renderTokens(tk,hint){
  return tk.map(o=>{
    let inner=esc(o.t);
    if(hint){
      const rt=o.r?(hasKanji(o.t)?o.r:kanaToRomaji(o.r)):'\u00a0';

  el.qtext.innerHTML=renderTokens(q.tk,S.hint);
  el.qtext.classList.toggle('long',q.len!=='word'&&q.tk.length>3);
  el.qtext.classList.toggle('hint',S.hint);
  el.hintBtn.setAttribute('aria-pressed',String(S.hint));
  el.hintBtn.textContent=S.hint?'🙈 Sembunyikan petunjuk':'💡 Petunjuk bacaan';
  const showM=S.mean&&!S.answered;
  el.meaning.hidden=!showM;el.meaning.textContent=showM?'Arti: '+S.q.id:'';
  el.meanBtn.setAttribute('aria-pressed',String(S.mean));
}
function nextQuestion(){
  stopMic();
  S.q=makeQ(S.mode,S.len,S.lastKey);S.lastKey=S.q.key;
  S.answered=false;S.hint=false;S.counted=false;S.resultOk=null;S.said='';
  S.mean=false;
  el.result.hidden=true;el.result.innerHTML='';
  el.next.hidden=true;el.skip.hidden=false;
  el.form.hidden=false;el.ans.value='';el.micStatus.textContent='';
  el.mic.hidden=false;
  drawQuestion();updateScore();
  el.ans.focus({preventScroll:true});
}
function startQuiz(mode){
  S.mode=mode;S.sess={c:0,t:0,streak:0};S.lastKey='';
  el.modePill.textContent=MODE_LABEL[mode];
  el.home.hidden=true;el.quiz.hidden=false;
  window.scrollTo(0,0);
  nextQuestion();
}
function goHome(){
  stopMic();
  if('speechSynthesis' in window)speechSynthesis.cancel();
  el.quiz.hidden=true;el.home.hidden=false;renderStat();window.scrollTo(0,0);
}

/* ---------- hasil ---------- */
function finish(ok,said){
  if(S.answered)return;
  S.answered=true;S.counted=true;S.prevStreak=S.sess.streak;S.said=said;S.resultOk=ok;
  S.sess.t++;store.t++;
  if(ok){S.sess.c++;store.c++;S.sess.streak++;store.b=Math.max(store.b,S.sess.streak)}else S.sess.streak=0;
  save();showResult();updateScore();
}
function showResult(){
  const q=S.q,ok=S.resultOk;
  stopMic();
  const cls=ok===null?'skip':ok?'ok':'bad';
  const head=ok===null?'Dilewati':ok?'✅ Benar!':'Belum tepat';
  let h=`<div class="res ${cls}"><div class="res-h">${head}</div>
    <div class="row"><span>Bacaan</span><b class="jp" lang="ja">${esc(q.readText)}</b></div>
    <div class="row"><span>Romaji</span><b>${esc(q.romText)}</b></div>
    <div class="row"><span>Arti</span><b>${esc(q.id)}</b></div>`;
  if(S.said)h+=`<div class="row"><span>Jawabanmu</span><b>${esc(S.said)}</b></div>`;
  h+=`<div class="rbtns"><button type="button" id="speak">🔊 Dengar</button>`;
  if(ok===false&&S.counted)h+=`<button type="button" id="override">Tandai benar</button>`;
  h+=`</div></div>`;
  el.result.innerHTML=h;el.result.hidden=false;
  el.form.hidden=true;el.micStatus.textContent='';
  el.meaning.hidden=true;
  el.skip.hidden=true;el.next.hidden=false;
  $('#speak').onclick=()=>speak(q.tk.map(o=>o.r).join(''));
  const ov=$('#override');if(ov)ov.onclick=override;
  S.hint=true;drawQuestion();            // tampilkan petunjuk bacaan setelah menjawab
  el.next.focus({preventScroll:true});
  el.result.scrollIntoView({block:'nearest',behavior:'smooth'});
}
function override(){
  if(!S.answered||S.resultOk!==false||!S.counted)return;
  S.resultOk=true;S.sess.c++;store.c++;S.sess.streak=S.prevStreak+1;
  store.b=Math.max(store.b,S.sess.streak);save();showResult();updateScore();
}
function speak(text){
  if(!('speechSynthesis' in window)||!text)return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);u.lang='ja-JP';u.rate=.85;
  const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.toLowerCase().replace('_','-').startsWith('ja'));
  if(v)u.voice=v;
  speechSynthesis.speak(u);
}

/* ---------- suara (Web Speech API) ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,listening=false;
function stopMic(){
  if(rec&&listening){try{rec.abort()}catch(e){}}
  listening=false;el.mic.classList.remove('on');
}
function toggleMic(){
  if(S.answered)return;
  if(!SR){el.micStatus.textContent='Browser ini belum mendukung pengenalan suara. Pakai Chrome, Edge, atau Safari — atau ketik romajinya.';return}
  if(listening){rec.stop();return}
  rec=new SR();rec.lang='ja-JP';rec.interimResults=true;rec.maxAlternatives=5;rec.continuous=false;
  rec.onstart=()=>{listening=true;el.mic.classList.add('on');el.micStatus.textContent='🎙️ Mendengarkan… ucapkan dalam bahasa Jepang'};
  rec.onresult=e=>{
    const r=e.results[e.results.length-1];
    if(r.isFinal){
      const alts=[...r].map(a=>a.transcript);
      listening=false;el.mic.classList.remove('on');
      finish(alts.some(a=>speechMatches(S.q,a)),`🎙️ ${alts[0]}`);
    }else el.micStatus.textContent='… '+r[0].transcript;
  };
  rec.onerror=e=>{
    const msg={'not-allowed':'Izin mikrofon ditolak. Aktifkan di pengaturan browser.','service-not-allowed':'Izin mikrofon ditolak.',
      'no-speech':'Suara tidak terdengar, coba lagi.','audio-capture':'Mikrofon tidak ditemukan.','network':'Pengenalan suara butuh koneksi internet.'};
    el.micStatus.textContent=msg[e.error]||('Gagal mendengarkan ('+e.error+').');
  };
  rec.onend=()=>{listening=false;el.mic.classList.remove('on')};
  try{rec.start()}catch(e){el.micStatus.textContent='Tidak bisa memulai mikrofon.'}
}

/* ---------- event ---------- */
$$('#lenHome button,#lenQuiz button').forEach(b=>b.addEventListener('click',()=>{
  const changed=S.len!==b.dataset.len;setLen(b.dataset.len);
  if(changed&&!el.quiz.hidden)nextQuestion();
}));
$$('.mcard').forEach(b=>b.addEventListener('click',()=>startQuiz(b.dataset.mode)));
$('#back').addEventListener('click',goHome);
el.hintBtn.addEventListener('click',()=>{S.hint=!S.hint;drawQuestion()});
el.meanBtn.addEventListener('click',()=>{
  if(S.answered)return;
  S.mean=!S.mean;drawQuestion();
});
function doCheck(e){
  if(e){e.preventDefault();e.stopPropagation()}
  try{
    if(S.answered||!S.q)return;
    const v=el.ans.value.trim();
    if(!v){el.micStatus.textContent='Ketik bacaannya dulu, lalu tekan Cek.';el.ans.focus();return}
    finish(typedMatches(S.q,v),v);
  }catch(err){el.micStatus.textContent='Terjadi galat: '+err.message;console.error(err)}
}
el.form.addEventListener('submit',doCheck);
$('#checkBtn').addEventListener('click',doCheck);   // cadangan bila submit form dicegat oleh skrip/gaya lain di halaman
el.mic.addEventListener('click',toggleMic);
el.skip.addEventListener('click',()=>{
  if(S.answered)return;
  S.answered=true;S.counted=false;S.resultOk=null;S.said='';S.sess.streak=0;
  showResult();updateScore();
});
el.next.addEventListener('click',nextQuestion);
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.isComposing&&S.answered&&!el.quiz.hidden&&document.activeElement!==$('#override')&&document.activeElement!==$('#speak')){
    e.preventDefault();nextQuestion();
  }
});

setLen('word');renderStat();
window.__yomu={makeQ,typedMatches,speechMatches,canon,kanaToRomaji,N,V,A,NA};
})();
</script>
