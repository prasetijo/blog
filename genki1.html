const $=s=>document.querySelector(s),sh=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]),day=()=>Math.floor(Date.now()/864e5);
let S=null;try{S=JSON.parse(localStorage.getItem('gk1'))}catch(e){}
S=S||{c:{},l:[],ok:{}};
const save=()=>{try{localStorage.setItem('gk1',JSON.stringify(S))}catch(e){}};
const wd=k=>{const[i,j]=k.split('-');return L[i][3][j]};
function grade(k,ok){const c=S.c[k]||(S.c[k]={b:1,d:day(),s:0,o:0});c.s++;if(ok){c.o++;c.b=Math.min(5,c.b+1)}else c.b=1;c.d=day()+[0,1,2,4,8,16][c.b]}
const mast=()=>Object.values(S.c).filter(c=>c.b>=4).length;
const logS=(k,l,c,n)=>{S.l.push({d:day(),k,l,c,n,m:mast()});save()};
function go(v){[0,1,2].forEach(i=>$('#t'+i).className=i==v?'on':'');[map,review,stats][v]()}
function map(){$('#app').innerHTML='<div class="path">'+L.map((l,i)=>{const open=i==0||S.ok[Math.min(i,13)-1]>=70,b=S.ok[i];return`<button class="node ${open?'':'lock'} ${b>=70?'done':''}" ${open?`onclick="lesson(${i})"`:''}><b>${i}</b><span>${l[0]}<small>${l[1]} ・ ${l[3].length} kotoba</small></span><em>${b!=null?'★ '+b+'%':open?'▶':'🔒'}</em></button>`}).join('')+'</div><p class="mu">Skor 70% atau lebih membuka pelajaran berikutnya.</p>'}
function lesson(i){const l=L[i];l[3].forEach((w,j)=>{const k=i+'-'+j;if(!S.c[k])S.c[k]={b:1,d:day(),s:0,o:0}});save();
$('#app').innerHTML=`<div class="card"><h3>${i>12?'Misi bonus':i?'Pelajaran '+i:'Pembuka'}: ${l[0]} <span class="mu">${l[1]}</span></h3><p>${l[2]}</p></div><div class="card"><table>${l[3].map(w=>`<tr><td>${w[0]}</td><td class="mu">${w[1]}</td><td>${w[2]}</td></tr>`).join('')}</table></div><button class="btn" onclick="quiz(${i})">⚔️ Mulai Soal</button><button class="btn alt" onclick="go(0)">Kembali ke peta</button>`}
function quiz(i){const ws=sh(L[i][3].map((w,j)=>[w,j])).slice(0,8);
const qs=ws.map(([w,j])=>{const rev=Math.random()<.5,d=sh(L[i][3].filter(x=>x!=w)).slice(0,3);
return rev?{q:w[2],a:w[0],o:sh([w,...d].map(x=>x[0])),k:i+'-'+j}:{q:w[0]+'<div class="mu" style="font-size:14px">'+w[1]+'</div>',a:w[2],o:sh([w,...d].map(x=>x[2])),k:i+'-'+j}});
const g=L[i][4];qs.push({q:g[0],a:g[1][g[2]],o:sh(g[1])});let n=0,sc=0;
(function show(){if(n>=qs.length){const p=Math.round(100*sc/qs.length);S.ok[i]=Math.max(S.ok[i]||0,p);logS('q',i,sc,qs.length);
$('#app').innerHTML=`<div class="card"><div class="big">${p>=70?'🎉':'💪'}</div><h3 style="text-align:center">Skor ${sc}/${qs.length} (${p}%)</h3><p class="mu" style="text-align:center">${p>=70?'Pelajaran berikutnya terbuka!':'Butuh 70% untuk lanjut. Coba lagi!'}</p></div><div class="row"><button class="btn alt" onclick="quiz(${i})">Ulangi</button><button class="btn" onclick="go(0)">Peta</button></div>`;return}
const q=qs[n];$('#app').innerHTML=`<div class="bar"><i style="width:${100*n/qs.length}%"></i></div><div class="card"><div class="q">${q.q}</div>${q.o.map((o,x)=>`<button class="opt" data-x="${x}">${o}</button>`).join('')}</div>`;
document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const ok=q.o[b.dataset.x]==q.a;document.querySelectorAll('.opt').forEach(c=>{c.onclick=null;if(q.o[c.dataset.x]==q.a)c.classList.add('ok')});if(!ok)b.classList.add('no');if(ok)sc++;if(q.k)grade(q.k,ok);n++;setTimeout(show,ok?600:1300)})})()}
function review(){const due=sh(Object.keys(S.c).filter(k=>S.c[k].d<=day())).slice(0,20);
if(!due.length){$('#app').innerHTML=`<div class="card"><div class="big">🍵</div><h3 style="text-align:center">${Object.keys(S.c).length?'Ulasan hari ini selesai':'Belum ada kotoba'}</h3><p class="mu" style="text-align:center">${Object.keys(S.c).length?'Kembali besok. Kata yang salah akan muncul lagi lebih cepat.':'Buka pelajaran di Petualangan dulu agar kotoba masuk ke deck.'}</p></div>`;return}
const Q=due.map(k=>({k,m:Math.floor(Math.random()*3)}));let n=0,ok=0,tot=0;
(function show(){if(!Q.length||n>=Q.length){if(tot)logS('r',-1,ok,tot);review();return}
const it=Q[n],w=wd(it.k),f=[w[0],w[2],w[1]][it.m],bk=[w[1]+' ・ '+w[2],w[0]+'<div class="mu">'+w[1]+'</div>',w[0]+' ・ '+w[2]][it.m];
$('#app').innerHTML=`<div class="bar"><i style="width:${100*n/Q.length}%"></i></div><div class="card"><p class="mu" style="text-align:center">${['Jepang → Indonesia','Indonesia → Jepang','Romaji → Jepang'][it.m]} ・ ${n+1}/${Q.length}</p><div class="big" id="f">${f}</div><div class="q" id="b" style="display:none">${bk}</div><button class="btn" id="flip">Balik kartu</button><div class="row" id="g" style="display:none"><button class="btn alt" id="n">Lupa</button><button class="btn" id="y">Ingat</button></div></div>`;
$('#flip').onclick=()=>{$('#b').style.display='block';$('#flip').style.display='none';$('#g').style.display='flex'};
const done=r=>{grade(it.k,r);tot++;if(r)ok++;else if(!it.r){Q.push({k:it.k,m:(it.m+1)%3,r:1})}n++;save();show()};
$('#y').onclick=()=>done(1);$('#n').onclick=()=>done(0)})()}
function line(v,col,max,sm){if(v.length<2)return'<p class="mu">Butuh minimal 2 sesi untuk grafik.</p>';const W=300,H=110,p=8;let e=[],x=v[0];v.forEach(y=>{x=sm*x+(1-sm)*y;e.push(x)});
const P=a=>a.map((y,i)=>(p+i*(W-2*p)/(a.length-1)).toFixed(1)+','+(H-p-y/max*(H-2*p)).toFixed(1)).join(' ');
return`<svg viewBox="0 0 ${W} ${H}">${[0,.5,1].map(t=>`<line x1="${p}" x2="${W-p}" y1="${H-p-t*(H-2*p)}" y2="${H-p-t*(H-2*p)}" stroke="var(--line)"/>`).join('')}<polyline points="${P(v)}" fill="none" stroke="${col}" opacity=".3" stroke-width="1.5"/><polyline points="${P(e)}" fill="none" stroke="${col}" stroke-width="2.5"/></svg><div class="mu">terakhir: ${Math.round(e[e.length-1]*10)/10} ・ maks sumbu: ${max}</div>`}
function bars(d,lb,max,col){const W=300,h=22;return`<svg viewBox="0 0 ${W} ${d.length*h}">${d.map((v,i)=>`<text x="0" y="${i*h+15}" fill="var(--mu)" font-size="11">${lb[i]}</text><rect x="62" y="${i*h+4}" width="${Math.max(1,v/max*220)}" height="14" rx="3" fill="${col}"/><text x="${66+v/max*220}" y="${i*h+15}" fill="var(--tx)" font-size="11">${Math.round(v*10)/10}</text>`).join('')}</svg>`}
let SM=.6;function stats(){const l=S.l,A=l.map(x=>100*x.c/x.n),tot=l.reduce((a,x)=>a+x.n,0),cr=l.reduce((a,x)=>a+x.c,0);
const days=new Set(l.map(x=>x.d));let st=0;for(let d=day();days.has(d)||(d==day()&&!st&&days.has(d-1));d--){if(days.has(d))st++;if(!days.has(d)&&d<day())break}
const H=[1,2,3,4,5].map(b=>Object.values(S.c).filter(c=>c.b==b).length),mx=Math.max(1,...H);
const LM=L.map((x,i)=>{const c=x[3].map((w,j)=>S.c[i+'-'+j]).filter(Boolean);return c.length?c.reduce((a,z)=>a+z.b,0)/x[3].length:0});
const cnt={};l.forEach(x=>cnt[x.d]=(cnt[x.d]||0)+x.n);
$('#app').innerHTML=`<div class="card gr"><div><b>${Object.keys(S.c).length}</b><span class="mu">kotoba</span></div><div><b>${mast()}</b><span class="mu">dikuasai</span></div><div><b>${st}🔥</b><span class="mu">hari beruntun</span></div></div>
<div class="card"><h3>accuracy / sesi (%)</h3>${line(A,'var(--pk)',100,SM)}<span class="mu">smoothing</span><input type="range" min="0" max="95" value="${SM*100}" oninput="SM=this.value/100;stats()"></div>
<div class="card"><h3>kotoba dikuasai (box ≥ 4) / sesi</h3>${line(l.map(x=>x.m),'var(--gd)',Math.max(5,...l.map(x=>x.m)),0)}</div>
<div class="card"><h3>histogram: distribusi box Leitner</h3>${bars(H,['Box 1 baru','Box 2','Box 3','Box 4','Box 5 hafal'],mx,'var(--gn)')}</div>
<div class="card"><h3>penguasaan per pelajaran (rata-rata box, maks 5)</h3>${bars(LM,L.map((x,i)=>'L'+i+' '+x[0].slice(0,6)),5,'var(--pk)')}</div>
<div class="card"><h3>aktivitas 28 hari (soal dijawab)</h3><div class="hm">${Array.from({length:28},(_,i)=>{const c=cnt[day()-27+i]||0;return`<i style="${c?`background:var(--pk);opacity:${Math.min(1,.3+c/30)}`:''}"></i>`}).join('')}</div><p class="mu">Total ${tot} jawaban, akurasi ${tot?Math.round(100*cr/tot):0}%. Data tersimpan di browser ini.</p></div>`}
go(0);
