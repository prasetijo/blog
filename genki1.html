function review(){const op=[];for(let i=1;i<=12;i++)if(i==1||S.ok[i-1]>=70)op.push(i);const u=new Set();run(Array.from({length:10},()=>mk(rn(op),u)),"Ulasan campur",(sc,n,wr)=>fin(sc,n,wr,"review()","go(2)","Soal dicampur dari semua bab yang sudah terbuka."))}
function map(){$("#app").innerHTML='<div class="path">'+L.slice(1,13).map((l,k)=>{const i=k+1,open=i==1||S.ok[i-1]>=70,b=S.ok[i];return`<button class="node ${open?"":"lock"} ${b>=70?"done":""}" ${open?`onclick="lesson(${i})"`:""}><b>${i}</b><span>${l[0]}<small>${l[1]}</small></span><em>${b!=null?"★ "+b+"%":open?"▶":"🔒"}</em></button>`}).join("")+'</div><p class="mu">Skor 70% atau lebih membuka bab berikutnya. Setiap kuis berisi 10 soal acak.</p>'}
function lesson(i){const l=L[i];$("#app").innerHTML=`<div class="card"><h3>Bab ${i}: ${l[0]} <span class="mu">${l[1]}</span></h3><p class="nt">${jf(l[2])}</p></div><details class="card"><summary>Daftar kotoba (referensi)</summary><table>${l[3].map(w=>`<tr><td>${w[0]}</td><td class="mu">${w[1]}</td><td>${w[2]}</td></tr>`).join("")}</table></details><button class="btn" onclick="quiz(${i})">✍️ Mulai Kuis Kalimat</button><button class="btn alt" onclick="go(0)">Kembali ke peta</button>`}
function go(v){[0,1,2].forEach(i=>$("#t"+i).className=i==v?"on":"");[map,review,stats][v]()}
function bars(d,lb,max,col){const h=22;return`<svg viewBox="0 0 300 ${d.length*h}">${d.map((v,i)=>`<text x="0" y="${i*h+15}" style="fill:var(--mu)" font-size="11">${lb[i]}</text><rect x="86" y="${i*h+4}" width="${Math.max(1,v/max*170)}" height="14" rx="3" style="fill:${col}"/><text x="${90+v/max*170}" y="${i*h+15}" style="fill:var(--tx)" font-size="11">${Math.round(v)}${d.pct?"%":""}</text>`).join("")}</svg>`}
function stats(){const h=S.h,n=h.length,okn=h.filter(x=>x.ok).length;let c=0;const cu=h.map(x=>c+=x.ok?1:-1),days=new Set(h.map(x=>x.d));let st=0,dd=day();if(!days.has(dd))dd--;while(days.has(dd)){st++;dd--}
const er={};h.forEach(x=>{if(!x.ok)er[x.r]=(er[x.r]||0)+1});const ek=Object.keys(RL).filter(k=>er[k]).sort((a,b)=>er[b]-er[a]);
const pl=[],pc=[];for(let i=1;i<=12;i++){const a=h.filter(x=>x.l==i);if(a.length){pl.push("Bab "+i);pc.push(100*a.filter(x=>x.ok).length/a.length)}}
const cnt={};h.forEach(x=>cnt[x.d]=(cnt[x.d]||0)+1);
const p=14,W=Math.max(300,n*16+2*p),H=190,lo=Math.min(0,...cu),hi=Math.max(1,...cu),X=i=>p+i*16,Y=v=>H-p-(v-lo)/(hi-lo)*(H-2*p);
let seg="",dots="";cu.forEach((v,i)=>{const pv=i?cu[i-1]:0,col=h[i].ok?"var(--gn)":"var(--gd)";seg+=`<line x1="${i?X(i-1):p}" y1="${Y(pv)}" x2="${X(i)}" y2="${Y(v)}" style="stroke:${col}" stroke-width="2.5"/>`;dots+=`<circle cx="${X(i)}" cy="${Y(v)}" r="${h[i].ok?3:4.5}" style="fill:${col}"/>`});
const cv=`<svg id="cv" viewBox="0 0 ${W} ${H}" style="width:${W}px;height:${H}px"><line x1="0" x2="${W}" y1="${Y(0)}" y2="${Y(0)}" style="stroke:var(--line)" stroke-dasharray="4"/>${seg}${dots}<circle id="mk" cx="-99" cy="0" r="9" fill="none" style="stroke:var(--tx)" stroke-width="2"/></svg>`;
$("#app").innerHTML=`<div class="card gr"><div><b>${n}</b><span>jawaban</span></div><div><b>${n?Math.round(100*okn/n):0}%</b><span>akurasi</span></div><div><b>${st}🔥</b><span>hari beruntun</span></div></div>
<div class="card"><h3>skor kumulatif: benar naik, salah turun</h3>${n?`<div id="sc" style="overflow-x:auto">${cv}</div><p class="mu">Biru = benar (naik), merah muda = salah (turun). Ketuk titik untuk melihat detail.</p><div id="dt"></div>`:`<p class="mu">Belum ada data. Kerjakan kuis kalimat dulu.</p>`}</div>
<div class="card"><h3>jenis kesalahan (jumlah salah)</h3>${ek.length?bars(ek.map(k=>er[k]),ek.map(k=>RL[k]),er[ek[0]],"var(--gd)"):`<p class="mu">Belum ada kesalahan.</p>`}</div>
<div class="card"><h3>akurasi per bab (%)</h3>${pl.length?bars(pc,pl,100,"var(--gn)"):`<p class="mu">Belum ada data.</p>`}</div>
<div class="card"><h3>aktivitas 28 hari</h3><div class="hm">${Array.from({length:28},(_,i)=>{const k=cnt[day()-27+i]||0;return`<i style="${k?`background:var(--pk);opacity:${Math.min(1,.35+k/30)}`:""}"></i>`}).join("")}</div></div>`;
if(!n)return;const D=k=>{const e=h[k],m=$("#mk");m.setAttribute("cx",X(k));m.setAttribute("cy",Y(cu[k]));$("#dt").innerHTML=`<b>#${k+1}</b> ${e.ok?"✅ Benar, skor naik ke "+cu[k]:"❌ Salah, skor turun ke "+cu[k]}<br>Bab ${e.l} ・ ${QL[e.q]} ・ jenis: <b>${RL[e.r]}</b><br>${e.id}<br>${e.jp}${e.ok?"":`<br>Jawabanmu: ${e.y}<br>Seharusnya: ${e.c}`}`};
$("#cv").onclick=e=>{const r=$("#cv").getBoundingClientRect();D(Math.max(0,Math.min(n-1,Math.round((e.clientX-r.left-p)/16))))};D(n-1);$("#sc").scrollLeft=1e6}
go(0);

</script></body></html>
