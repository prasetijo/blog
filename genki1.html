14:[["v:1:4|かも","Negatif + かも しれません = mungkin tidak ～. Contoh: たべないかも しれません。"],["|から|","から = dari (pemberi) pada もらう; boleh menggantikan に."],["かも","～かも しれません = mungkin ～ (bentuk biasa + かもしれません)."],["あげ","あげる = memberi (kepada orang lain); penerima ditandai に."],["くれ","くれる = (orang lain) memberi kepada saya; sayalah penerimanya."],["もらい","もらう = menerima; pemberi ditandai に / から."],["どう","～たら どうですか = bagaimana kalau ～? (saran). Lampau biasa + ら."],["しか","Angka + しか + negatif = hanya ～ (sedikit)."],["|も|","Angka + も = sebanyak itu (terasa banyak). Contoh: みっつも たべました。"],["","Memberi dan menerima: あげる / くれる / もらう."]],
15:[["おきましょう","～て おきましょう = ayo ～ lebih dulu."],["おいて","～て おいて ください = tolong lakukan ～ lebih dulu (～ておく + ください)."],["v:1:3|a=ひと","Bentuk lampau biasa + kata benda: ひと = orang yang (telah) ～."],["おもって","～(よ)うと おもって います = sedang berpikir untuk ～ (rencana)."],["おきます","～て おく = melakukan ～ lebih dulu (persiapan)."],["a=ひと","Kalimat sebelum kata benda menerangkannya: ごはんを たべる ひと = orang yang makan nasi."],["v:1:7|か","～(よ)うか = bagaimana kalau kita ～? (ajakan akrab)."],["","Bentuk kehendak: ru → ～よう (たべよう); u → ～おう (のもう); する → しよう; くる → こよう."]],
16:[["あげましょう","～て あげましょうか = maukah saya ～ untuk Anda? (menawarkan bantuan)."],["くれて","～て くれて ありがとう ございました = terima kasih sudah ～."],["あげ","～て あげる = melakukan ～ untuk orang lain."],["くれ","～て くれる = (orang lain) melakukan ～ untuk saya."],["もらい","～て もらう = meminta/mendapat orang lain melakukan ～ untuk saya."],["いただけ","～て いただけませんか = bisakah Anda ～? (permintaan sangat sopan)."],["|とき|","～とき = saat ～. Sifat-na + な, kata benda + の + とき."],["すみませんでした","～て すみませんでした = maaf, saya telah ～."],["と|いい","～と いい = semoga ～ (harapan). Contoh: はれると いいですね。"],["","～て あげる / くれる / もらう: arah pemberian tindakan."]],
17:[["かも","～かも しれません = mungkin ～ (lihat Bab 14)."],["だ|って","～だって = katanya ～ (bentuk akrab dari ～だと)."],["|そう|","Bentuk biasa + そうです = katanya ～ (kabar). Beda dengan そう bab 13 (kelihatannya)."],["v:1:3+ら","～たら = kalau/setelah ～ (lampau biasa + ら)."],["くても","～なくても いい = tidak perlu ～. Contoh: たべなくても いいです。"],["まえに","V-kamus + まえに = sebelum ～."],["+から","V-て + から = setelah ～."],["みたい","～みたいです = sepertinya ～ (dugaan dari kesan)."],["って","～って = bentuk akrab dari ～と (mengutip)."],["","Kabar, syarat, dan urutan waktu."]],
18:[["しまった","～て しまった = (akrab) terlanjur ～; ungkapan menyesal."],["しまい","V-て + しまう = terlanjur / tuntas melakukan ～."],["ながら","Stem + ながら = sambil ～ (dua aksi bersamaan)."],["v:1:8","V-ば + よかった = andai saja ～ (menyesal)."],["|と|","V-kamus + と = kalau ～ maka ～ (akibat alami)."],["n:3:0","Kata kerja tak-transitif (あく, つく, しまる): benda sebagai subjek が, terjadi dengan sendirinya."],["n:4:0","Kata kerja transitif (あける, つける, しめる): ada pelaku (は) dan objek (を)."],["","Pasangan transitif / tak-transitif."]],
19:[["v:2:1","Hormat (sonkeigo) untuk tindakan orang yang dihormati: みます → ごらんになります, たべます → めしあがります, いきます → いらっしゃいます."],["くれて","V-て + くれて ありがとう = terima kasih sudah ～."],["よかった","V-て + よかったです = syukurlah / senang ～."],["はず","V-kamus + はずです = seharusnya ～ (dugaan kuat)."],["","Bahasa hormat."]],
20:[["s=わたし","Merendah (kenjougo) untuk tindakan sendiri: みます → はいけんします, いいます → もうします, いきます → まいります, たべます → いただきます."],["+で|","V-ない + で = tanpa melakukan ～."],["どうか","～か どうか = apakah ～ atau tidak (pertanyaan di dalam kalimat)."],["という","Nama + という + kata benda = ～ yang bernama ～."],["やすい","Stem + やすい = mudah ～."],["にくい","Stem + にくい = sulit ～."],["","Bahasa merendah."]],
21:[["ほしくない","V-て + ほしくない = tidak ingin (orang lain) melakukan ～."],["ぬすまれ","Pasif kerugian: korban は, pelaku に, benda を, V-pasif. Contoh: ぬすまれました。"],["v:3","Pasif: V-られる (ru: たべられる; u: ほめる → ほめられる). Pelaku ditandai に."],["n:5:0","V-て + ある = keadaan hasil tindakan yang disengaja; objek jadi が. Contoh: まどが あけて あります。"],["あいだに","～あいだに = selama ～ (sesuatu terjadi di tengah kejadian lain)."],["a:7:1","Sifat-na に / sifat-i く + する = membuat jadi ～. Contoh: きれいに します。"],["ほしい","V-て + ほしい = ingin (orang lain) melakukan ～."],["","Pasif dan keadaan."]],
22:[["v:1:9","Kausatif: V-させる (ru: たべさせる; u: よむ → よませる). Yang disuruh ditandai に."],["なさい","Stem + なさい = perintah lembut (dari orang tua/guru)."],["v:1:8","Bentuk ば: V-えば / V-れば + いい = cukup ～ saja."],["のに","A のに B = padahal/meski A, B (hasil tak terduga)."],["のように","N のように + V = seperti N. Contoh: とりのように とびます。"],["","Kausatif."]],
23:[["v:1:9","Kausatif-pasif: V-させられる = dipaksa melakukan ～. Contoh: たべさせられました。"],["+も|","V-て + も = meskipun ～, tetap ～."],["こと|に","V-kamus + ことに する = memutuskan untuk ～."],["|まで|","～から ～まで = dari ～ sampai ～."],["+かた","Stem + かた = cara ～. Contoh: たべかた = cara makan."],["","Kausatif-pasif."]]};
